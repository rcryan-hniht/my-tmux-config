# ==============================================================================
# Tmux Theme Configuration
# Light: Oasis Starlight (High Contrast) / Sequoia Monochrome Light
# Dark:  Black Metal Default (Chuẩn Ghostty Built-in Theme)
# Tự động chuyển đổi theo #{client_theme}: 'light' hoặc 'dark'
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BẢNG MÀU CHÍNH (Oasis Starlight Contrast Light / Black Metal Default Dark)
# ------------------------------------------------------------------------------

# Background:
#   Light: #e8e4db (Oasis Starlight Contrast Mantle - phân tách rõ ràng với nền terminal/pane #faf7f2)
#   Dark:  #000000 (Ghostty Black Metal background - OLED black chuẩn)
set -g @theme-bg '#{?#{==:#{client_theme},light},#faf4ed,#faf4ed}'

# Surface / Active tab background:
#   Light: #d4cec0 (Oasis Starlight warm sand surface)
#   Dark:  #404040 (Ghostty Black Metal palette 8 - dark gray surface)
set -g @theme-surface '#{?#{==:#{client_theme},light},#dfdad9,#dfdad9}'

# Foreground / Text:
#   Light: #1f242d (Oasis Starlight dark slate charcoal - độ tương phản cao)
#   Dark:  #c1c1c1 (Ghostty Black Metal foreground / palette 7)
set -g @theme-fg '#{?#{==:#{client_theme},light},#575279,#575279}'

# Muted / Secondary:
#   Light: #7a766c (Oasis Starlight readable muted warm gray)
#   Dark:  #888888 (Ghostty Black Metal palette 4 - muted gray)
set -g @theme-muted '#{?#{==:#{client_theme},light},#9893a5,#9893a5}'

# Accent:
#   Light: #1c6eb3 (Oasis Sapphire Blue - xanh dương nổi bật, tương phản cao)
#   Dark:  #dd9999 (Ghostty Black Metal palette 2/10 - signature pale rose accent)
set -g @theme-accent '#{?#{==:#{client_theme},light},#d7827e,#d7827e}'

# ------------------------------------------------------------------------------
# 2. DỰ PHÒNG CÁC THEME KHÁC (Bỏ comment để dùng khi cần đổi)
# ------------------------------------------------------------------------------
# [Lựa chọn 2] Sequoia Monochrome Light & Dark:
# set -g @theme-bg '#{?#{==:#{client_theme},light},#edeef2,#0f1014}'
# set -g @theme-surface '#{?#{==:#{client_theme},light},#d4d5dc,#575861}'
# set -g @theme-fg '#{?#{==:#{client_theme},light},#282930,#868690}'
# set -g @theme-muted '#{?#{==:#{client_theme},light},#5f6370,#575861}'
# set -g @theme-accent '#{?#{==:#{client_theme},light},#525666,#999eb2}'

# [Lựa chọn 3] Oasis Abyss Dark (Neovim oasis.nvim):
# set -g @theme-bg '#{?#{==:#{client_theme},light},#e8e4db,#000000}'
# set -g @theme-surface '#{?#{==:#{client_theme},light},#d4cec0,#1c1c1c}'
# set -g @theme-fg '#{?#{==:#{client_theme},light},#1f242d,#f5f5dc}'
# set -g @theme-muted '#{?#{==:#{client_theme},light},#7a766c,#605c4d}'
# set -g @theme-accent '#{?#{==:#{client_theme},light},#1c6eb3,#d8cf7f}'

# ------------------------------------------------------------------------------
# 3. SELECTION / VISUAL MODE (Vim Copy-Mode Highlight)
# Tmux không expand định dạng #{E:...} trong mode-style, nên dùng Hooks để set giá trị màu trực tiếp:
#   Light: Light Sky Blue (#b8d8f8) với chữ tối (#1f242d)
#   Dark:  Ghostty Black Metal selection (#c1c1c1) với chữ đen (#000000)
# ------------------------------------------------------------------------------
set-hook -g client-light-theme 'set -g mode-style "bg=#dfdad9,fg=#575279,bold"'
set-hook -g client-dark-theme 'set -g mode-style "bg=#dfdad9,fg=#575279,bold"'
set-hook -g client-light-theme[50] 'run-shell -b "~/.config/tmux/scripts/tmux-theme.sh --sync-agy light"'
set-hook -g client-dark-theme[50] 'run-shell -b "~/.config/tmux/scripts/tmux-theme.sh --sync-agy dark"'

# Áp dụng ngay khi khởi động hoặc reload
if-shell -F '#{==:#{client_theme},light}' \
  'set -g mode-style "bg=#dfdad9,fg=#575279,bold"' \
  'set -g mode-style "bg=#dfdad9,fg=#575279,bold"'

# ------------------------------------------------------------------------------
# 4. STATUS BAR & PANE STYLES
# ------------------------------------------------------------------------------
set -g status-style 'bg=#{E:@theme-bg},fg=#{E:@theme-fg}'
set -g message-style 'bg=#{E:@theme-surface},fg=#{E:@theme-accent},bold'
set -g message-command-style 'bg=#{E:@theme-surface},fg=#{E:@theme-accent},bold'
set -g pane-border-style 'fg=#{E:@theme-surface}'
set -g pane-active-border-style 'fg=#{E:@theme-accent}'

# Left status: Session name badge
set -g status-left-length 60
set -g status-left '#[fg=#{E:@theme-bg}]#[bg=#{E:@theme-accent}]#[bold] #S #[default] '

# Right status: PREFIX badge + ZOOMED badge + IME (EN/VI)
set -g status-right-length 120
set -g status-right '#{?client_prefix,#[fg=#{E:@theme-bg}]#[bg=#{E:@theme-accent}]#[bold] 󰠠 PREFIX #[default],}#{?window_zoomed_flag,#[fg=#{E:@theme-fg}]#[bg=#{E:@theme-surface}]#[bold] 󰊓 ZOOMED #[default],} #{?#{==:#{@ime_label},VI},#[fg=#{E:@theme-accent}]#[bg=#{E:@theme-surface}]#[bold] VI #[default],#[fg=#{E:@theme-muted}] EN #[default]}'

# Window tabs
set -g window-status-format '#[fg=#{E:@theme-muted}] 󰈚 #I:#W '
set -g window-status-current-format '#[fg=#{E:@theme-accent}]#[bg=#{E:@theme-surface}]#[bold] 󰈚 #I:#W #[default]'
set -g window-status-separator ''
