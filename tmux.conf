# Enable Colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',alacritty*:Tc:sitm=\E[3m'

# Allow Shift+Enter and extended keys to pass through to CLI apps (agy, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Allow terminal escape sequences for graphics (Kitty graphics protocol, Ghostty)
# `all` lets hidden panes (e.g. tdf in another window) send Kitty clear sequences cleanly.
set -g allow-passthrough all
set -ga update-environment TERM 
set -ga update-environment TERM_PROGRAM
# Prefix Key
set -g prefix C-Space
unbind C-b
bind-key -N "Send prefix key" C-Space send-prefix

# Window and pane index start at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Attach to another session instead of detaching when last window closes
set -g detach-on-destroy off

# Better clipboard integration on Wayland
set -g set-clipboard on

# Open new windows / sessions in current directory path
unbind n
bind -N "Create a new window" n new-window -c "#{pane_current_path}"
unbind t
bind -N "Create a new session" t new-session -c "#{pane_current_path}"

# Kill pane without confirmation
bind -N "Kill current pane" x kill-pane

# Quick switch between last two windows
bind -N "Switch to last window" Space last-window

# Switch windows with prefix + Left/Right or H/L (Shift+h/l)
unbind Left
unbind Right
bind -N "Previous window" -r Left previous-window
bind -N "Next window" -r Right next-window
bind -N "Previous window" -r H previous-window
bind -N "Next window" -r L next-window

# Break pane into its own window / Join pane into previous or next window
bind -N "Break pane into a new window" b break-pane
bind -N "Join pane into previous window (horizontal)" M-h join-pane -h -t :-1
bind -N "Join pane into next window (horizontal)" M-l join-pane -h -t :+1
bind -N "Join pane into previous window (vertical)" M-k join-pane -v -t :-1
bind -N "Join pane into next window (vertical)" M-j join-pane -v -t :+1

# Split Windows
unbind %
bind -N "Split pane horizontally" \\ split-window -h -c "#{pane_current_path}"
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
unbind '"'
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"

# Reload Config
unbind r
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# Resize Panes
bind -N "Resize pane down" -r j resize-pane -D 5
bind -N "Resize pane up" -r k resize-pane -U 5
bind -N "Resize pane right" -r l resize-pane -R 5
bind -N "Resize pane left" -r h resize-pane -L 5
bind -N "Toggle pane zoom" -r m resize-pane -Z

# Enable Mouse
set -g mouse on

# Scrollback
set -g history-limit 10000

# Status messages display time
set -g display-time 2000

# Status bar refresh interval (30s thay vì 5s để giảm tải subshell)
set -g status-interval 30
run-shell -b '~/.config/tmux/scripts/tmux-ime.sh --sync && ~/.config/tmux/scripts/tmux-ime.sh --watch'

# VIM motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Thoát copy-mode bằng i, a, o (tương tự vào Insert mode của Vim)
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X cancel
bind-key -T copy-mode-vi o send-keys -X cancel

# Tự động vào copy-mode (Normal mode) khi chuyển sang pane terminal (không phải Vim/PDF/cht.sh/clock)
set-hook -g after-select-pane 'if-shell -F "#{&&:#{!=:#{pane_in_mode},1},#{!=:#{@tex_preview},1},#{!=:#{@tdf_pane},1},#{!=:#{@cht_pane},1},#{!=:#{@clock_cava},1},#{!:#{m/r:(view|l?n?vim?x?|fzf|tdf),#{pane_current_command}}}}" "copy-mode" ""'

# Paste từ Wayland clipboard (wl-paste) bằng prefix + p (bỏ paste tmux buffer mặc định)
unbind ]
unbind p
bind -N "Paste from clipboard (wl-paste)" p run-shell 'wl-paste -n 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p || true'

# Hoán đổi vị trí Pane bằng Ctrl + Alt + h/j/k/l
bind -N "Swap pane with left" -n C-M-h swap-pane -d -t '{left-of}'
bind -N "Swap pane with below" -n C-M-j swap-pane -d -t '{down-of}'
bind -N "Swap pane with above" -n C-M-k swap-pane -d -t '{up-of}'
bind -N "Swap pane with right" -n C-M-l swap-pane -d -t '{right-of}'

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status Line Position
set-option -g status-position top

##### Plugins #####
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

##### Theme: Black Metal (dark) / Sequoia Monochrome (light) #####
source-file ~/.config/tmux/themes.conf

##### Auto Save / Restore (TTL 48h) #####
# Tắt cào 50.000 dòng log pane để tránh lag khi chạy lab/wireshark
# Lưu thủ công khi cần: Ctrl+Space rồi Ctrl+s | Khôi phục: Ctrl+Space rồi Ctrl+r
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Lưu ngay khi detach và dọn session/lịch sử quá 48 giờ
set-hook -g client-detached 'run-shell -b "~/.config/tmux/scripts/resurrect-save.sh"'
set-hook -g client-attached 'run-shell -b "~/.config/tmux/scripts/resurrect-ttl.sh --prune-sessions"'

# Báo ngay cho tdf cập nhật/xóa ảnh Kitty khi đổi window, session, zoom hoặc copy-mode
set-hook -g session-window-changed[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'
set-hook -g client-session-changed[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'
set-hook -g window-layout-changed[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'
set-hook -g pane-mode-changed[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'
set-hook -g client-attached[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'
set-hook -g client-detached[50] 'run-shell -b "pkill -USR1 -x tdf 2>/dev/null || true"'

##### Neovim CheckHealth Recommendations #####
set-option -sg escape-time 10
set-option -g focus-events on

##### Pop-Up: Clock #####
bind -N "Popup: clock" c display-popup -E -b none -w 100% -h 100% ~/.config/tmux/scripts/tmux-clock.sh

##### Pop-Up: LazyGit #####
bind -N "Popup: LazyGit" g display-popup -d "#{pane_current_path}" -E -b none -w 80% -h 80% lazygit

##### Pop-Up: LazyDocker #####
bind -N "Popup: LazyDocker" G display-popup -E -b none -w 85% -h 85% ~/.local/bin/lazydocker

##### Pop-Up: btop #####
bind -N "Popup: btop" B display-popup -E -b none -w 85% -h 85% btop

##### Pop-Up: Project Sessionizer #####
bind -N "Popup: Project sessionizer" P display-popup -E -b rounded -T " Projects" -w 50% -h 60% ~/.config/tmux/scripts/tmux-sessionizer.sh

##### Pop-Up: URL Picker #####
bind -N "Popup: URL picker" u display-popup -E -b rounded -T " URLs" -w 60% -h 50% ~/.config/tmux/scripts/tmux-url.sh

##### Pop-Up: Cheat Sheet (cht.sh) #####
bind -N "Popup: Cheat sheet (cht.sh)" C-c display-popup -E -b rounded -T " cht.sh" -w 75% -h 80% '~/.config/tmux/scripts/tmux-cht.sh #{pane_id}'

##### Pop-Up: Colorscheme Switcher #####
bind -N "Popup: Colorscheme switcher (Ghostty/tmux/nvim/sigye/agy)" C display-popup -E -b rounded -T " Colorscheme" -w 72% -h 68% ~/.config/tmux/scripts/tmux-theme.sh

##### Pop-Up: CLI Quick Examples #####
bind -N "Popup: CLI examples" e display-popup -E -b rounded -T " CLI Examples" -w 75% -h 80% ~/.config/tmux/scripts/tmux-tldr.sh

##### Pop-Up: Todo (todo.md) #####
bind -N "Popup: Todo (todo.md)" T display-popup -E -b rounded -T " Todo" -w 75% -h 80% 'mkdir -p ~/ryan/Notes && nvim ~/ryan/Notes/todo.md'

##### Pop-Up: Port & Process Killer #####
bind -N "Popup: Kill port/process" K display-popup -E -b rounded -T " Kill Port / Process" -w 75% -h 65% ~/.config/tmux/scripts/tmux-kill.sh
bind -N "Popup: Session history (x: xóa)" X display-popup -E -b rounded -T " Sessions & history" -w 60% -h 60% ~/.config/tmux/scripts/tmux-history.sh

##### Pop-Up: Keybind Finder #####
bind -N "Popup: Keybind finder" F display-popup -E -b rounded -T " Keybindings" -w 65% -h 70% ~/.config/tmux/scripts/tmux-keys.sh

##### Pop-Up: Pane Layout Presets #####
bind -N "Popup: Window layout presets" W display-popup -E -b rounded -T " Layouts" -w 50% -h 40% ~/.config/tmux/scripts/tmux-layout.sh

##### Pop-Up: SSH Menu #####
bind -N "Popup: SSH menu" S display-popup -E -b none -w 40% -h 50% ~/.config/tmux/scripts/tmux-ssh.sh

##### Pop-Up: TeX -> PDF (tectonic + tdf) #####
bind -N "Popup: TeX to PDF (tectonic)" C-t display-popup -d "#{pane_current_path}" -E -b rounded -T " TeX -> PDF (tectonic)" -w 75% -h 70% '~/.config/tmux/scripts/tmux-tex.sh #{q:pane_current_path} #{pane_id}'

##### Pop-Up: PDF Picker (tdf) #####
bind -N "Popup: PDF picker (tdf)" v display-popup -d "#{pane_current_path}" -E -b rounded -T " PDFs (tdf)" -w 78% -h 75% ~/.config/tmux/scripts/tmux-pdf.sh

##### Pop-Up: AI Agents Monitor (agy / claude / codex) #####
bind -N "Popup: AI agents monitor (agy/claude/codex)" a display-popup -E -b none -w 100% -h 100% ~/.config/tmux/scripts/tmux-agents.sh
set-hook -g after-select-pane[60] 'run-shell -b "~/.config/tmux/scripts/tmux-agent-hook.sh --mark-seen #{pane_id}"'
set-hook -g after-select-window[60] 'run-shell -b "~/.config/tmux/scripts/tmux-agent-hook.sh --mark-seen #{pane_id}"'
set-hook -g client-session-changed[60] 'run-shell -b "~/.config/tmux/scripts/tmux-agent-hook.sh --mark-seen #{pane_id}"'

##### TPM Init #####
# Xóa lịch sử resurrect quá 48h trước khi continuum tự động khôi phục
run-shell '~/.config/tmux/scripts/resurrect-ttl.sh'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'

